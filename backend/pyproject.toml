[project]
name = "chicago-saferoute-backend"
version = "0.1.0"
description = "Crime-weighted routing + Gemini AI narration for Chicago SafeRoute"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # Data
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "scipy>=1.14.0",
    "numpy>=2.1.0",
    # Graph / routing
    "osmnx>=2.0.0",
    "networkx>=3.4.0",
    "shapely>=2.0.0",
    # Gemini AI
    "google-genai>=1.0.0",
    # SSE streaming
    "sse-starlette>=2.1.0",
    # Required by OSMnx nearest_nodes on unprojected graphs
    "scikit-learn>=1.5.0",
    "google-cloud-texttospeech>=2.34.0",
]

[tool.uv]
package = false
